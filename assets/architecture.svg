<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="1000" height="640" fill="#ffffff"/>

  <!-- Google -->
  <rect x="20" y="20" width="680" height="600" rx="18" fill="#fbfcfe" stroke="#b8bfcc" stroke-width="1.5"/>
  <text x="684" y="50" text-anchor="end" font-size="17" fill="#333">Google Workspace + Google Cloud</text>

  <!-- Add-on container -->
  <rect x="50" y="70" width="430" height="230" rx="14" fill="#f4f7fc" stroke="#b8bfcc" stroke-width="1.2"/>
  <text x="468" y="95" text-anchor="end" font-size="13.5" fill="#333">Gmail · Apps Script</text>
  <rect x="80" y="108" width="370" height="174" rx="12" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
  <text x="265" y="140" text-anchor="middle" font-size="16" font-weight="600" fill="#222">Gmail Add-on</text>
  <text x="265" y="166" text-anchor="middle" font-size="13" fill="#555">reads the open email · shows the verdict</text>
  <rect x="150" y="196" width="230" height="56" rx="10" fill="#dff5e6" stroke="#5fbf84" stroke-width="1.3"/>
  <text x="265" y="229" text-anchor="middle" font-size="13.5" font-weight="600" fill="#2f6b45">Sender memory</text>

  <!-- Add-on <-> backend -->
  <line x1="245" y1="285" x2="245" y2="352" stroke="#555" stroke-width="1.4" stroke-dasharray="6,5" marker-end="url(#arrow)"/>
  <line x1="275" y1="352" x2="275" y2="285" stroke="#555" stroke-width="1.4" stroke-dasharray="6,5" marker-end="url(#arrow)"/>
  <text x="290" y="324" font-size="13.5" fill="#2b6cb0">HTTPS + ID token</text>

  <!-- Cloud Run container -->
  <rect x="50" y="355" width="430" height="245" rx="14" fill="#f4f7fc" stroke="#b8bfcc" stroke-width="1.2"/>
  <text x="468" y="378" text-anchor="end" font-size="13.5" fill="#333">Cloud Run · BE container</text>
  <rect x="80" y="388" width="370" height="30" rx="8" fill="#fff4e5" stroke="#e0a458" stroke-width="1.2"/>
  <text x="265" y="408" text-anchor="middle" font-size="12.5" fill="#7a4b12">token check</text>
  <rect x="80" y="428" width="370" height="157" rx="12" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
  <text x="100" y="456" font-size="16" font-weight="600" fill="#222">FastAPI</text>
  <rect x="235" y="456" width="190" height="104" rx="10" fill="#dff5e6" stroke="#5fbf84" stroke-width="1.3"/>
  <text x="330" y="500" text-anchor="middle" font-size="14" font-weight="600" fill="#2f6b45">Analysis engine</text>
  <text x="330" y="522" text-anchor="middle" font-size="12.5" fill="#2f6b45">checks → score → verdict</text>

  <!-- Secret Manager -->
  <rect x="520" y="455" width="160" height="140" rx="14" fill="#f4f7fc" stroke="#b8bfcc" stroke-width="1.2"/>
  <text x="668" y="478" text-anchor="end" font-size="13.5" fill="#333">Secret Manager</text>
  <ellipse cx="585" cy="535" rx="34" ry="42" fill="#dff5e6" stroke="#5fbf84" stroke-width="1.2" opacity="0.85"/>
  <ellipse cx="600" cy="535" rx="34" ry="42" fill="#dff5e6" stroke="#5fbf84" stroke-width="1.2" opacity="0.85"/>
  <ellipse cx="615" cy="535" rx="34" ry="42" fill="#dff5e6" stroke="#5fbf84" stroke-width="1.2" opacity="0.85"/>
  <text x="600" y="540" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2f6b45">API key</text>
  <line x1="518" y1="535" x2="456" y2="535" stroke="#555" stroke-width="1.4" stroke-dasharray="6,5" marker-end="url(#arrow)"/>

  <!-- External threat intel -->
  <rect x="730" y="300" width="250" height="320" rx="14" fill="#f4f7fc" stroke="#b8bfcc" stroke-width="1.2"/>
  <text x="968" y="324" text-anchor="end" font-size="13.5" fill="#333">External threat intel</text>
  <rect x="750" y="345" width="210" height="100" rx="12" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
  <text x="855" y="388" text-anchor="middle" font-size="15" font-weight="600" fill="#222">RDAP registries</text>
  <text x="855" y="410" text-anchor="middle" font-size="12.5" fill="#555">domain age</text>
  <rect x="750" y="470" width="210" height="100" rx="12" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
  <text x="855" y="513" text-anchor="middle" font-size="15" font-weight="600" fill="#222">abuse.ch</text>
  <text x="855" y="535" text-anchor="middle" font-size="12.5" fill="#555">known malware</text>

  <!-- Backend <-> external -->
  <line x1="454" y1="432" x2="726" y2="398" stroke="#555" stroke-width="1.4" stroke-dasharray="6,5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
</svg>
